name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Dependencies
      run: bun install

    - name: Build Web Project
      run: bun run build

    - name: Initialize Capacitor and Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        rm -rf android
        npx cap init Ladder com.example.ladder --web-dir=dist
        npx cap add android

    # এখানে আমরা JDK 17 পরিবর্তন করে JDK 21 করে দিয়েছি
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Sync Code to Android Folder
      run: npx cap sync

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ladder-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

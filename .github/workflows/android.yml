name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Dependencies
      run: bun install

    - name: Build Web Project
      run: bun run build

    # এখানে আমরা প্রজেক্টে মোবাইল অ্যাপের (Capacitor) প্রয়োজনীয় ফাইল যোগ করছি
    - name: Add Android Platform
      run: |
        bun add @capacitor/core @capacitor/cli
        bunx cap init Ladder com.example.ladder --web-dir=dist
        bun add @capacitor/android
        bunx cap add android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        cache-dependency-path: 'android/build.gradle'

    - name: Sync with Capacitor
      run: bunx cap sync

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
